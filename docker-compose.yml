# Default json-file has no size cap or rotation — left unset, container logs
# grow forever (bot/hermes log an INFO line per Telegram poll, ~every 10s).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
      HERMES_URL: http://hermes:8642
      MCP_TOOLS_URL: http://mcp-tools:8000
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_started

  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile.mcp-tools
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
    depends_on:
      db:
        condition: service_healthy

  hermes:
    image: nousresearch/hermes-agent:v2026.7.20  # arm64 + amd64; date-based tags (no semver)
    restart: unless-stopped
    logging: *default-logging
    # The OpenAI-compatible POST /v1/chat/completions on :8642 is the gateway
    # "api_server" platform adapter — it only exists while `hermes gateway run`
    # is up and API_SERVER_ENABLED/API_SERVER_KEY are set. The bot authenticates
    # with API_SERVER_KEY. HERMES_HOME=/opt/data holds config.yaml + the sqlite
    # session store, so it must be a persisted, WRITABLE volume — Hermes rewrites
    # config.yaml at runtime, so we seed our files into it on boot rather than
    # bind-mounting them read-only (a RO bind makes `config set` fail EBUSY).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp -n /seed/config.yaml /opt/data/config.yaml 2>/dev/null || true
        cp -n /seed/SOUL.md /opt/data/SOUL.md 2>/dev/null || true
        exec /init /opt/hermes/docker/main-wrapper.sh gateway run
    env_file:
      - path: .env
        required: false
    environment:
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      HERMES_MODEL: deepseek/deepseek-v4-flash
      HERMES_INFERENCE_PROVIDER: openrouter
      # API_SERVER_KEY and OPENROUTER_API_KEY come from .env
      # Hermes auto-activates any messaging platform whose requires_env vars
      # it sees (plugins/platforms/telegram/plugin.yaml: TELEGRAM_BOT_TOKEN).
      # We only want Hermes as an API-server backend for `bot`'s own Telegram
      # polling, not as a second Telegram client racing it for the same
      # token's getUpdates long-poll — blank it out here to override .env.
      TELEGRAM_BOT_TOKEN: ""
    volumes:
      - hermes-data:/opt/data  # config.yaml + SOUL.md + session store (persisted, writable)
      - ./deploy/hermes:/seed:ro  # source for first-boot seeding
    depends_on:
      - mcp-tools

volumes:
  db-data:
  hermes-data:
