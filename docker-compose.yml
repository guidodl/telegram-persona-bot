services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
      HERMES_URL: http://hermes:8642
      MCP_TOOLS_URL: http://mcp-tools:8000
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_started

  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile.mcp-tools
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
    depends_on:
      db:
        condition: service_healthy

  hermes:
    image: nousresearch/hermes-agent:v2026.7.20  # arm64 + amd64; date-based tags (no semver)
    restart: unless-stopped
    # The OpenAI-compatible POST /v1/chat/completions on :8642 is the gateway
    # "api_server" platform adapter — it only exists while `hermes gateway run`
    # is up and API_SERVER_ENABLED/API_SERVER_KEY are set. The bot authenticates
    # with API_SERVER_KEY. HERMES_HOME=/opt/data holds config.yaml + the sqlite
    # session store, so it must be a persisted volume.
    command: ["gateway", "run"]
    env_file:
      - path: .env
        required: false
    environment:
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # API_SERVER_KEY and the model provider key (e.g. OPENROUTER_API_KEY) come from .env
    volumes:
      - hermes-data:/opt/data  # session store + state.db (persisted)
      - ./deploy/hermes/config.yaml:/opt/data/config.yaml:ro
      - ./deploy/hermes/SOUL.md:/opt/data/SOUL.md:ro
    depends_on:
      - mcp-tools

volumes:
  db-data:
  hermes-data:
