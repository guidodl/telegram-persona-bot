services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
      HERMES_URL: http://hermes:8642
      MCP_TOOLS_URL: http://mcp-tools:8000
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_started

  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile.mcp-tools
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
    depends_on:
      db:
        condition: service_healthy

  hermes:
    image: nousresearch/hermes-agent:0.17.0  # PIN the arm64-supporting tag verified for the Pi
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./deploy/hermes/config.yaml:/etc/hermes/config.yaml:ro
    depends_on:
      - mcp-tools

volumes:
  db-data:
